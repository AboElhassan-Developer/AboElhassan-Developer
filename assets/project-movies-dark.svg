<svg xmlns="http://www.w3.org/2000/svg" width="410" height="238" viewBox="0 0 410 238" role="img" aria-label="Movie Browser: Movie explorer on the TMDB API with search, details, recommendations and a saved wishlist, in four languages with automatic RTL/LTR switching.">
<title>Movie Browser: Movie explorer on the TMDB API with search, details, recommendations and a saved wishlist, in four languages with automatic RTL/LTR switching.</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a2e"/><stop offset="1" stop-color="#1a1238"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(0 0.5 0.5)">
    <stop offset="0" stop-color="#7c5cff"/><stop offset="0.45" stop-color="#262c44"/><stop offset="0.55" stop-color="#262c44"/><stop offset="1" stop-color="#ff7aa8"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ff5c8a" stop-opacity="0.28"/><stop offset="1" stop-color="#ff5c8a" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="1" y="1" width="408" height="236" rx="17"/></clipPath>
</defs>
<rect x="1" y="1" width="408" height="236" rx="17" fill="url(#bg)"/>
<g clip-path="url(#clip)">
  <circle cx="380" cy="20" r="130" fill="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite"/>
  </circle>
</g>
<rect x="1" y="1" width="408" height="236" rx="17" fill="none" stroke="url(#border)" stroke-width="1.6"/>
<rect x="24" y="24" width="46" height="46" rx="12" fill="url(#badge)"/>
<g transform="translate(33 33) scale(1.17)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M10 9.2v5.6l4.6-2.8z" fill="#fff"/></g>
<text x="84" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Movie Browser</text>
<text x="84" y="64" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#8b949e">Front-End  ·  Feb – Mar 2025</text>
<text x="24" y="106" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9d1d9">Movie explorer on the TMDB API with search, details,</text>
<text x="24" y="126" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9d1d9">recommendations and a saved wishlist, in four languages</text>
<text x="24" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9d1d9">with automatic RTL/LTR switching.</text>
<g transform="translate(24.0 188)"><rect width="76.5" height="26" rx="13" fill="#1a1f33" stroke="#2f3654"/><text x="9" y="17" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#c9d1d9" textLength="58.5" lengthAdjust="spacingAndGlyphs">Angular 17</text></g>
<g transform="translate(106.5 188)"><rect width="80.9" height="26" rx="13" fill="#1a1f33" stroke="#2f3654"/><text x="9" y="17" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#c9d1d9" textLength="62.9" lengthAdjust="spacingAndGlyphs">TypeScript</text></g>
<g transform="translate(193.4 188)"><rect width="47.1" height="26" rx="13" fill="#1a1f33" stroke="#2f3654"/><text x="9" y="17" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#c9d1d9" textLength="29.1" lengthAdjust="spacingAndGlyphs">RxJS</text></g>
<g transform="translate(246.5 188)"><rect width="74.3" height="26" rx="13" fill="#1a1f33" stroke="#2f3654"/><text x="9" y="17" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#c9d1d9" textLength="56.4" lengthAdjust="spacingAndGlyphs">TMDB API</text></g>
<g transform="translate(326.9 188)"><rect width="40.4" height="26" rx="13" fill="#1a1f33" stroke="#2f3654"/><text x="9" y="17" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#c9d1d9" textLength="22.4" lengthAdjust="spacingAndGlyphs">i18n</text></g>
</svg>
