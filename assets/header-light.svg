    <text x="34" y="46" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#6a4cf0" opacity="0">public async Task&lt;IActionResult&gt; Get()
