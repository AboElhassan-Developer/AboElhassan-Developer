  <text x="420" y="207" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#59636e" letter-spacing="0.5">ASP.NET Core  ·  Angular  ·  SQL Server  ·  Azure</text>
