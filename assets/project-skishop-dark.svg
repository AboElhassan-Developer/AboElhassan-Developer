<svg xmlns="http://www.w3.org/2000/svg" width="410" height="238" viewBox="0 0 410 238" role="img" aria-label="SkiShop: Online store built on Clean Architecture with Stripe checkout, Redis caching and live order notifications over SignalR, plus an Angular 19 storefront with filters.">
<title>SkiShop: Online store built on Clean Architecture with Stripe checkout, Redis caching and live order notifications over SignalR, plus an Angular 19 storefront with filters.</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a2e"/><stop offset="1" stop-color="#1a1238"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(0 0.5 0.5)">
    <stop offset="0" stop-color="#7c5cff"/><stop offset="0.45" stop-color="#262c44"/><stop offset="0.55" stop-color="#262c44"/><stop offset="1" stop-color="#ff7aa8"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.28"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="1" y="1" width="408" height="236" rx="17"/></clipPath>
</defs>
<rect x="1" y="1" width="408" height="236" rx="17" fill="url(#bg)"/>
<g clip-path="url(#clip)">
  <circle cx="380" cy="20" r="130" fill="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite"/>
  </circle>
</g>
<rect x="1" y="1" width="408" height="236" rx="17" fill="none" stroke="url(#border)" stroke-width="1.6"/>
<rect x="24" y="24" width="46" height="46" rx="12" fill="url(#badge)"/>
<g transform="translate(33 33) scale(1.17)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></g>
<text x="84" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">SkiShop</text>
