<text x="24" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9d1d9">SignalR, plus an Angular 19 storefront with filters.</text>
